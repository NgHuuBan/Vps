name: Minecraft Server 7GB with Playit + Push to Repo

on:
  workflow_dispatch:

jobs:
  mc-server:
    runs-on: ubuntu-latest

    steps:
    - name: Cài Java 21 (Temurin)
      run: |
        sudo apt update
        sudo apt install -y wget tar git curl
        wget https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.3%2B9/OpenJDK21U-jre_x64_linux_hotspot_21.0.3_9.tar.gz
        mkdir -p ~/java21
        tar -xzf OpenJDK21U-jre_x64_linux_hotspot_21.0.3_9.tar.gz -C ~/java21 --strip-components=1
        echo "JAVA_HOME=$HOME/java21" >> $GITHUB_ENV
        echo "$HOME/java21/bin" >> $GITHUB_PATH

    - name: Tạo thư mục server
      run: mkdir -p server

    - name: Tải PaperMC 1.21.4 build 232
      working-directory: server
      run: |
        curl -L -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/232/downloads/paper-1.21.4-232.jar

    - name: Chạy Playit.gg để mở port Minecraft
      working-directory: server
      run: |
        wget https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -O playit
        chmod +x playit
        ./playit > playit.log &
        sleep 10
        echo "🌐 Link Minecraft (playit.gg):"
        grep -oP 'tcp:\/\/.*playit\.gg:\d+' playit.log || echo "⏳ Chờ thêm vài giây..."

    - name: Chạy Minecraft server 7GB
      working-directory: server
      run: |
        java -Xmx7G -Xms7G -jar paper.jar nogui || true
        echo "✅ Server đã tắt — giữ job chạy tiếp 6 tiếng"
        sleep 6h

    - name: Push thư mục server vào repo
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} repo-clone
        cp -r server repo-clone/server
        cd repo-clone
        git add server
        git commit -m "📦 Cập nhật tự động thư mục server sau khi chạy workflow"
        git push
        
