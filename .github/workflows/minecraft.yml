name: Run Minecraft Server 7GB (paper.jar tự tải vào server/)

on:
  workflow_dispatch:

jobs:
  mc-server:
    runs-on: ubuntu-latest

    steps:
    - name: Cài Java 21 (Temurin)
      run: |
        sudo apt update
        sudo apt install -y wget tar curl gpg
        wget https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.3%2B9/OpenJDK21U-jre_x64_linux_hotspot_21.0.3_9.tar.gz
        mkdir -p ~/java21
        tar -xzf OpenJDK21U-jre_x64_linux_hotspot_21.0.3_9.tar.gz -C ~/java21 --strip-components=1
        echo "JAVA_HOME=$HOME/java21" >> $GITHUB_ENV
        echo "$HOME/java21/bin" >> $GITHUB_PATH

    - name: Tạo thư mục server nếu chưa có
      run: mkdir -p server

    - name: Cài playit từ repo chính thức
      run: |
        curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
        echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
        sudo apt update
        sudo apt install -y playit

    - name: Khởi chạy playit.gg để mở port Minecraft
      working-directory: server
      run: |
        playit > playit.log &
        sleep 10
        echo "🌐 Link Minecraft (playit.gg):"
        grep -oP 'tcp:\/\/.*playit\.gg:\d+' playit.log || echo "⏳ Đang chờ port..."

    - name: Tải paper.jar nếu chưa có
      working-directory: server
      run: |
        if [ ! -f paper.jar ]; then
          curl -L -o paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/232/downloads/paper-1.21.4-232.jar
        fi

    - name: Tạo file eula.txt tự động
      working-directory: server
      run: echo "eula=true" > eula.txt

    - name: Chạy Minecraft server từ server/paper.jar (7GB)
      working-directory: server
      run: |
        java -Xmx7G -Xms7G -jar paper.jar nogui || true
        echo "✅ Server đã tắt — giữ hoạt động thêm 6 tiếng"
        sleep 6h
        
